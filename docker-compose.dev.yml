# Local development database only. Never use this file for a customer install.
# Usage: DATASCOPE_DEV_DB_PASSWORD=<pick one> docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: datascope
      POSTGRES_PASSWORD: ${DATASCOPE_DEV_DB_PASSWORD:?Set DATASCOPE_DEV_DB_PASSWORD first}
      POSTGRES_DB: datascope_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datascope-dev-pg:/var/lib/postgresql/data
volumes:
  datascope-dev-pg:
